name: VM Deploy (build here, run on VM)

# Build on GitHub runners (2-4GB RAM) — VM (832MB) only RUNS the prebuilt
# standalone output, it never builds.
# Required repo secrets (4 total):
#   VM_HOST, VM_USER, VM_PASSWORD (deploy target, password auth)
#   PROD_ENV (multiline: paste full all.env content — all MYSQL/FIREBASE/
#   MEDIA/NEXT_PUBLIC vars; baked at build time, VM .env CANNOT change
#   NEXT_PUBLIC_* later).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write production env file
        run: |
          printf '%s\n' "${{ secrets.PROD_ENV }}" > .env.production
          echo "NEXT_PUBLIC_SITE_URL=https://app.medisparkbd.com" >> .env.production
      - name: Build (with full production env)
        run: pnpm build
      - name: Pack standalone
        run: |
          mkdir -p ship
          cp -r .next/standalone/. ship/
          cp -r .next/static/. ship/.next/static/
          cp -r public/. ship/public/
          cp deploy/vm-ecosystem.config.cjs ship/ecosystem.config.cjs
          cp package.json ship/package.json
          cp package-lock.json ship/package-lock.json 2>/dev/null || true
          cp pnpm-lock.yaml ship/pnpm-lock.yaml 2>/dev/null || true
          # copy the media server as well
          mkdir -p ship/server
          cp server/medifiles-server.mjs ship/server/medifiles-server.mjs
          tar -czf ship.tar.gz -C ship .
      - name: Ship + restart on VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: ship.tar.gz
          target: /home/${{ secrets.VM_USER }}/medispark-pkg
      - name: Restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          envs: PROD_ENV
          script: |
            # Fresh dir every deploy — old standalone fully removed, no stale files.
            rm -rf ~/medispark && mkdir -p ~/medispark
            tar -xzf ~/medispark-pkg/ship.tar.gz -C ~/medispark
            printf '%s\n' "$PROD_ENV" > ~/medispark/.env
            echo 'NEXT_PUBLIC_SITE_URL=https://app.medisparkbd.com' >> ~/medispark/.env
            
            # Install production dependencies for standalone next.js (MySQL, Firebase Admin)
            cd ~/medispark && npm i --omit=dev --no-audit --no-fund || npm i mysql2 firebase-admin --no-audit --no-fund
            cd ~/medispark && pm2 startOrRestart ecosystem.config.cjs
            
            # Update Media Server script and restart its systemd service
            echo "${{ secrets.VM_PASSWORD }}" | sudo -S cp ~/medispark/server/medifiles-server.mjs /opt/medifiles/medifiles-server.mjs
            echo "${{ secrets.VM_PASSWORD }}" | sudo -S systemctl restart medifiles
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
